<!-- Modal: Confirmação de Conclusão com Tempo Investido -->
<div class="modal fade" id="modalTempoConclusao" tabindex="-1" aria-labelledby="modalTempoConclusaoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background-color: #002B49; color: #fff;">
        <h5 class="modal-title" id="modalTempoConclusaoLabel"><i class="bi bi-check-circle-fill me-2"></i>Confirmar Conclusão</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <p class="mb-3">Deseja realmente alterar o status deste apontamento para <strong>Concluído</strong>?</p>
        
        <!-- Container do tempo investido (exibido apenas se tempo for 0/nulo) -->
        <div id="containerTempoInvestido" class="mb-3 d-none">
          <label for="inputTempoMinutos" class="form-label fw-semibold">Tempo Investido (minutos) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" id="inputTempoMinutos" min="1" placeholder="Ex: 60" required>
          <div class="form-text">Obrigatório para concluir o apontamento.</div>
          <div class="invalid-feedback">Informe um tempo válido maior que zero.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" id="btnCancelarConclusao" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn" id="btnConfirmarConclusao" style="background-color: #002B49; color: #fff;">Confirmar e Concluir</button>
      </div>
    </div>
  </div>
</div>
