{% extends 'base.html' %}

{% block title %}Erro Interno do Servidor - Portal SEMEQ{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-code display-1 text-danger">500</div>
            <h2 class="mb-3">Erro Interno do Servidor</h2>
            <p class="text-muted mb-4">Ocorreu um erro inesperado. Nossa equipe foi notificada e está trabalhando para resolver.</p>
            <a href="{% url 'semeq:home' %}" class="btn btn-semeq-primary">
                <i class="bi bi-house-door me-1"></i> Voltar ao Início
            </a>
            <a href="javascript:history.back()" class="btn btn-semeq-outline ms-2">
                <i class="bi bi-arrow-left me-1"></i> Tentar Novamente
            </a>
        </div>
    </div>
</div>
{% endblock %}
