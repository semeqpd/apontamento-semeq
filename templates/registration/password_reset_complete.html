{% extends 'base.html' %}

{% block title %}Senha Redefinida - Portal SEMEQ{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-dashboard">
                <div class="card-header">
                    <div class="header-brand">
                        <i class="bi bi-check-circle-fill text-success"></i>
                        <span>Senha Alterada</span>
                    </div>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="bi bi-shield-check" style="font-size: 4rem; color: #10b981;"></i>
                    </div>
                    <h4 class="mb-3">Senha redefinida com sucesso!</h4>
                    <p class="text-muted mb-4">
                        Sua senha foi alterada. Agora você pode fazer login com a nova senha.
                    </p>
                    <a href="{% url 'semeq:login' %}" class="btn btn-semeq-primary">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Fazer Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
