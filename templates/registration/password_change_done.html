{% extends 'base.html' %}

{% block title %}Senha Alterada - Portal SEMEQ{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 500px;">
    <div class="card">
        <div class="card-body text-center py-5">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            </div>
            <h3 class="mb-3">Senha alterada com sucesso!</h3>
            <p class="text-muted">Sua senha foi atualizada. Você pode continuar usando o sistema.</p>
            <a href="{% url 'semeq:configuracoes' %}" class="btn btn-semeq-primary mt-3">
                <i class="bi bi-gear me-1"></i> Voltar às Configurações
            </a>
        </div>
    </div>
</div>
{% endblock %}
