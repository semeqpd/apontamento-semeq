{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal SEMEQ{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- Google Fonts, Bootstrap 5 & Icons via CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Design System SEMEQ (shared CSS) -->
    <style>
        :root {
            --semeq-navy: #0a1033;
            --semeq-navy-hover: #141c4f;
            --semeq-blue-accent: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-muted: #64748b;
        }

        /* DARK MODE - mantém a paleta SEMEQ (navy/blue), apenas inverte superfícies */
        [data-theme="dark"] {
            --bg-body: #0b1220;
            --card-bg: #16203a;
            --border-color: #2a3a5c;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --semeq-navy-hover: #1e2a4a;
            --input-bg: #1e2d4a;
            --input-border: #3a4f7a;
        }

        [data-theme="dark"] body { background-color: var(--bg-body); color: var(--text-primary); }
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select,
        [data-theme="dark"] .form-control:focus,
        [data-theme="dark"] .form-select:focus,
        [data-theme="dark"] textarea.form-control,
        [data-theme="dark"] input.form-control {
            background-color: var(--input-bg) !important;
            color: var(--text-primary) !important;
            border-color: var(--input-border) !important;
        }
        [data-theme="dark"] select option,
        [data-theme="dark"] .form-select option {
            background-color: #ffffff;
            color: #1e293b;
        }
        [data-theme="dark"] .form-label { color: var(--text-primary); }
        [data-theme="dark"] .btn-semeq-outline:hover {
            background-color: var(--semeq-navy-hover);
            color: var(--text-primary);
        }
        [data-theme="dark"] .form-text { color: var(--text-muted) !important; }
        [data-theme="dark"] .text-danger:not(.progress-bar) { color: #f87171 !important; }
        [data-theme="dark"] .card-metric h6 { color: var(--text-muted) !important; }
        [data-theme="dark"] .alert { background-color: var(--card-bg); border-color: var(--border-color); }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }

        .form-control, .form-select {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--semeq-navy);
            box-shadow: 0 0 0 0.3rem rgba(10, 16, 51, 0.15);
            background-color: #ffffff;
        }

        .form-control[readonly] {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--semeq-navy);
        }

        .form-check-input:checked {
            background-color: var(--semeq-navy);
            border-color: var(--semeq-navy);
        }

        /* PASSWORD INPUT WRAPPER */
        .password-input-wrapper {
          position: relative;
          display: flex;
          align-items: center;
          width: 100%;
        }
        .password-input-wrapper input[type="password"],
        .password-input-wrapper input[type="text"],
        .password-input-wrapper input[type="email"] {
          flex: 1 1 auto;
          width: 100%;
          min-width: 0;
          padding-right: 45px !important;
          box-sizing: border-box;
        }
        .password-input-wrapper .password-toggle-btn {
          position: absolute !important;
          right: 10px !important;
          top: 50% !important;
          transform: translateY(-50%) !important;
          margin-left: 0 !important;
          height: auto !important;
          z-index: 2;
          background: transparent !important;
          border: none !important;
          padding: 0 !important;
          cursor: pointer !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          min-width: 44px !important;
          min-height: 44px !important;
          color: var(--text-muted, #64748b) !important;
          transition: color 0.15s ease !important;
        }
        .password-input-wrapper .password-toggle-btn:hover {
          color: var(--semeq-navy, #0a1033) !important;
        }
        .password-input-wrapper .password-toggle-btn:focus,
        .password-input-wrapper .password-toggle-btn:active {
          outline: none !important;
          box-shadow: none !important;
          color: var(--text-muted, #64748b) !important;
        }
        .password-input-wrapper:focus-within input {
          border-color: var(--semeq-navy);
          box-shadow: 0 0 0 0.3rem rgba(10, 16, 51, 0.15);
        }
        .password-input-wrapper .password-toggle-btn i {
          font-size: 1.1rem;
          line-height: 1;
        }

        .btn-semeq-primary {
            background-color: var(--semeq-navy);
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-semeq-primary:hover {
            background-color: var(--semeq-navy-hover);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(10, 16, 51, 0.15);
        }

        .btn-semeq-outline {
            border: 1px solid var(--semeq-navy);
            color: var(--semeq-navy);
            font-weight: 600;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            width: 100%;
            background: transparent;
        }
        .btn-semeq-outline:hover {
            background-color: var(--semeq-navy);
            color: #ffffff;
        }

        .alert {
            border-radius: 6px;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
        }

        .card-dashboard {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(10, 16, 51, 0.04);
            background: var(--card-bg);
        }
        .card-dashboard .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-brand i {
            font-size: 1.3rem;
            color: var(--semeq-navy);
        }
        .section-title {
            color: var(--semeq-navy);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--semeq-navy);
            padding-left: 10px;
        }

        .progress {
            background-color: var(--border-color);
        }
        .progress-bar {
            background-color: var(--semeq-navy);
        }

        .form-text {
            color: var(--text-muted);
            font-size: 0.8125rem;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block auth_content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/password-toggle.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
